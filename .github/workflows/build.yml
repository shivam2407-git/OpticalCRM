name: Build OpticalCRM

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify Installation
        run: |
          python --version
          pip list

      - name: Build OpticalCRM
        run: |
          pyinstaller --clean --noconfirm OpticalCRM.spec

      - name: Show Build Output
        run: |
          dir dist
          dir dist\OpticalCRM

      - name: Upload OpticalCRM
        uses: actions/upload-artifact@v4
        with:
          name: OpticalCRM
          path: dist/OpticalCRM
          if-no-files-found: error
          retention-days: 7