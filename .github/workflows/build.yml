name: Build OpticalCRM (Nuitka)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with Nuitka
        run: |
          python -m nuitka ^
            --standalone ^
            --onefile ^
            --enable-plugin=tk-inter ^
            --include-data-file=app.py=app.py ^
            --include-data-file=pdf_generator.py=pdf_generator.py ^
            --include-data-file=optical_store.db=optical_store.db ^
            --include-data-file=logo.ico=logo.ico ^
            launcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: OpticalCRM
          path: "*.exe"