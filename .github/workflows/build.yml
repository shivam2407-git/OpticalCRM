name: Build OpticalCRM Windows EXE

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller ^
            --onedir ^
            --windowed ^
            --name OpticalCRM ^
            --icon logo.ico ^
            --add-data "optical_store.db;." ^
            app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: OpticalCRM-Windows
          path: dist/OpticalCRM